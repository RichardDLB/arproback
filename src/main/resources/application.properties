# Database connection is provided by the deployment environment.
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=true
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:2}

# Render supplies PORT; local runs default to 8080.
server.port=${PORT:8080}

# JWT_SECRET must be a Base64-encoded key generated for this application.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600}

# Optional first administrator bootstrap. Set all four values in Render.
app.admin.name=${APP_ADMIN_NAME:}
app.admin.username=${APP_ADMIN_USERNAME:}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}